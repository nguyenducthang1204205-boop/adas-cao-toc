<text x="150.0" y="234.0" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Bấm “Cài đặt” trên thanh tiêu</text>
<text x="150.0" y="251.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">đề</text>
<rect x="344.0" y="204.2" width="172.0" height="67.2" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="430.0" y="225.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Chọn nấc tốc độ trên thẻ</text>
<text x="430.0" y="242.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">“Tốc độ xe của bạn”: 60 /</text>
<text x="430.0" y="259.6" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">≤80 / ≤100 / ≤120 km/h</text>
<rect x="940.5" y="309.4" width="189.0" height="101.4" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="1035.0" y="330.7" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">cfg.speed_kmh = v;</text>
<text x="1035.0" y="347.8" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">compute_thresholds → hiển</text>
<text x="1035.0" y="364.9" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">thị “Cảnh báo &lt; X m · Nguy</text>
<text x="1035.0" y="381.9" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">hiểm &lt; Y m” và căn cứ (quy</text>
<text x="1035.0" y="399.0" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">định / quy tắc 2 giây)</text>
<rect x="642.5" y="448.8" width="195.0" height="84.3" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="740.0" y="470.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Mở SettingsDialog: 4 tab</text>
<text x="740.0" y="487.2" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Chung, Điều kiện đường, Trợ</text>
<text x="740.0" y="504.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">lý AI, Nâng cao (nạp cấu</text>
<text x="740.0" y="521.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">hình hiện hành)</text>
<rect x="56.0" y="571.1" width="188.0" height="84.3" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="150.0" y="592.4" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Tab “Chung”: chọn loại xe</text>
<text x="150.0" y="609.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">theo dõi, bật/tắt và nghe thử</text>
<text x="150.0" y="626.6" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">âm thanh, chỉ cảnh báo cùng</text>
<text x="150.0" y="643.7" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">làn, tự nhận diện làn</text>
<rect x="52.0" y="693.4" width="196.0" height="67.2" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="150.0" y="714.7" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Tab “Điều kiện đường”: chọn</text>
<text x="150.0" y="731.8" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">thời tiết / mặt đường (5 mẫu),</text>
<text x="150.0" y="748.9" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">tầm nhìn xa</text>
<rect x="648.5" y="798.7" width="183.0" height="67.2" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="740.0" y="820.0" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Tự điền hệ số điều kiện, μ,</text>
<text x="740.0" y="837.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">TTC cảnh báo / nguy hiểm;</text>
<text x="740.0" y="854.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">hiển thị tóm tắt ngưỡng</text>
<rect x="53.0" y="903.9" width="194.0" height="101.4" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="150.0" y="925.2" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Tab “Nâng cao” (nếu cần):</text>
<text x="150.0" y="942.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">mô hình, độ tin cậy, IoU, hệ</text>
<text x="150.0" y="959.4" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">số, μ, giãn cách, tỷ lệ nguy</text>
<text x="150.0" y="976.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">hiểm, TTC, chống báo nhầm;</text>
<text x="150.0" y="993.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">bấm “Lưu”</text>
<rect x="645.0" y="1043.3" width="190.0" height="67.2" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="740.0" y="1064.6" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Ràng buộc: TTC nguy hiểm</text>
<text x="740.0" y="1081.7" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">≤ TTC cảnh báo − 0,5 s; bỏ</text>
<text x="740.0" y="1098.8" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">chọn hết loại xe → giữ “car”</text>
<rect x="652.5" y="1148.6" width="175.0" height="84.3" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="740.0" y="1169.9" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">update_inplace(cfg); lưu</text>
<text x="740.0" y="1186.9" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">system_config +</text>
<text x="740.0" y="1204.0" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">config_history “Cài đặt hệ</text>
<text x="740.0" y="1221.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">thống”</text>
