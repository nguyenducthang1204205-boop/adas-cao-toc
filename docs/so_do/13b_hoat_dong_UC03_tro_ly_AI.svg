<text x="900.0" y="1061.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">số theo LIMITS; trả</text>
<text x="900.0" y="1078.6" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">AssistantResult</text>
<rect x="383.5" y="1128.4" width="183.0" height="67.2" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="475.0" y="1149.7" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Hiển thị trả lời;</text>
<text x="475.0" y="1166.8" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">update_inplace(cfg.policy);</text>
<text x="475.0" y="1183.9" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">đổi tốc độ nếu tài xế có nêu</text>
<rect x="380.5" y="1233.6" width="189.0" height="84.3" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="475.0" y="1254.9" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Tính lại ngưỡng, báo “Đã áp</text>
<text x="475.0" y="1272.0" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">dụng: … → ở V km/h: cảnh</text>
<text x="475.0" y="1289.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">báo &lt; X m, nguy hiểm &lt; Y</text>
<text x="475.0" y="1306.2" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">m”</text>
<rect x="388.5" y="1356.0" width="173.0" height="67.2" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="475.0" y="1377.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Lưu system_config +</text>
<text x="475.0" y="1394.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">config_history “Trợ lý AI</text>
<text x="475.0" y="1411.4" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">(nguồn): điều kiện”</text>
