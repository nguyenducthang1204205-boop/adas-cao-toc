<text x="160.0" y="1482.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Xem ngưỡng mới trên thẻ</text>
<text x="160.0" y="1499.6" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">“Tốc độ xe của bạn” và “Điều</text>
