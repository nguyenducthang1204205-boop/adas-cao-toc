<rect x="66.5" y="116.0" width="187.0" height="118.5" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="160.0" y="137.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Bấm 1 trong 8 nút điều kiện</text>
<text x="160.0" y="154.4" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">đường (Khô ráo, Mưa nhỏ,</text>
<text x="160.0" y="171.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Mưa to, Sương mù, Trơn</text>
<text x="160.0" y="188.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">trượt, Ban đêm, Chở nặng,</text>
<text x="160.0" y="205.6" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Mệt mỏi) hoặc gõ mô tả vào</text>
<text x="160.0" y="222.7" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">khung chat</text>
<rect x="381.0" y="272.5" width="188.0" height="50.2" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="475.0" y="293.8" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">ChatPanel.submit(text): hiện</text>
<text x="475.0" y="310.9" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">câu hỏi, khóa nút Gửi</text>
<rect x="379.0" y="360.6" width="192.0" height="101.4" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="475.0" y="381.9" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Chạy _AssistantTask trên</text>
<text x="475.0" y="399.0" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">QThreadPool kèm chính</text>
<text x="475.0" y="416.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">sách, tốc độ hiện tại và mô tả</text>
<text x="475.0" y="433.2" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">cảnh quan (xe phía trước,</text>
<text x="475.0" y="450.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">TTC, mức cảnh báo)</text>
<polygon points="900.0,500.0 971.2,542.2 900.0,584.4 828.8,542.2" fill="#fff" stroke="#1f1f1f" stroke-width="1.4" stroke-linejoin="round"/>
<text x="900.0" y="538.4" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Dùng Claude</text>
<text x="900.0" y="555.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">(use_cloud)?</text>
<rect x="923.0" y="622.4" width="194.0" height="84.3" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="1020.0" y="643.7" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Gọi Claude API:</text>
<text x="1020.0" y="660.7" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">messages.create, đầu ra JSON</text>
<text x="1020.0" y="677.8" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">theo RESPONSE_SCHEMA,</text>
<text x="1020.0" y="694.9" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">effort low</text>
<polygon points="1020.0,744.7 1084.3,769.8 1020.0,794.8 955.7,769.8" fill="#fff" stroke="#1f1f1f" stroke-width="1.4" stroke-linejoin="round"/>
<text x="1020.0" y="774.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Thành công?</text>
<rect x="686.0" y="832.8" width="188.0" height="84.3" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="780.0" y="854.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Tư vấn offline: nhận diện từ</text>
<text x="780.0" y="871.2" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">khóa tiếng Việt (có / không</text>
<text x="780.0" y="888.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">dấu), tốc độ, tầm nhìn →</text>
<text x="780.0" y="905.4" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">condition_policy</text>
<rect x="935.0" y="849.9" width="170.0" height="50.2" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="1020.0" y="871.2" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Đọc JSON: reply, policy,</text>
<text x="1020.0" y="888.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">speed_kmh</text>
<polygon points="900.0,955.2 915.0,970.2 900.0,985.2 885.0,970.2" fill="#fff" stroke="#1f1f1f" stroke-width="1.4" stroke-linejoin="round"/>
