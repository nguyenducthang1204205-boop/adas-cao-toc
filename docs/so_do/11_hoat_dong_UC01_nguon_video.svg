<text x="170.0" y="137.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Mở menu nguồn ▾ trên thanh</text>
<text x="170.0" y="154.4" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">tiêu đề, chọn “Quản lý</text>
