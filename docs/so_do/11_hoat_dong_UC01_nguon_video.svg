<text x="670.0" y="259.6" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">video_sources; hiển thị tên,</text>
<text x="670.0" y="276.7" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">loại, địa chỉ, căn chỉnh, số</text>
<text x="670.0" y="293.8" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">phiên, lần dùng gần nhất</text>
