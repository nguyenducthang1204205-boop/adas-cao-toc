<rect x="72.0" y="116.0" width="176.0" height="50.2" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="160.0" y="137.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Bấm “Lịch sử” (thanh tiêu</text>
<text x="160.0" y="154.4" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">đề hoặc tab “Vi phạm”)</text>
<rect x="658.0" y="204.2" width="164.0" height="101.4" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="740.0" y="225.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Mở HistoryDialog; đọc</text>
<text x="740.0" y="242.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">thống kê (stats) và danh</text>
<text x="740.0" y="259.6" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">sách phiên</text>
<text x="740.0" y="276.7" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">(v_session_summary),</text>
<text x="740.0" y="293.8" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">dòng đầu “Tất cả phiên”</text>
<rect x="72.5" y="343.6" width="175.0" height="84.3" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="160.0" y="364.9" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Chọn phiên; đặt bộ lọc: từ</text>
<text x="160.0" y="381.9" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">ngày – đến ngày, mức</text>
<text x="160.0" y="399.0" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">(nguy hiểm / cảnh báo),</text>
<text x="160.0" y="416.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">loại xe</text>
<rect x="652.5" y="465.9" width="175.0" height="84.3" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="740.0" y="487.2" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">list_violations theo phiên</text>
<text x="740.0" y="504.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">và bộ lọc; hiển thị bảng vi</text>
<text x="740.0" y="521.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">phạm, số vi phạm khớp</text>
<text x="740.0" y="538.4" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">lọc</text>
<rect x="94.0" y="588.2" width="132.0" height="38.0" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="160.0" y="612.0" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Chọn một vi phạm</text>
<rect x="657.0" y="664.2" width="166.0" height="84.3" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="740.0" y="685.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Hiển thị ảnh bằng chứng</text>
<text x="740.0" y="702.6" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">(snapshot_path) và tóm</text>
<text x="740.0" y="719.7" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">tắt; ảnh đã bị xóa → để</text>
<text x="740.0" y="736.7" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">trống</text>
<polygon points="160.0,786.5 229.7,811.6 160.0,836.7 90.3,811.6" fill="#fff" stroke="#1f1f1f" stroke-width="1.4" stroke-linejoin="round"/>
<text x="160.0" y="816.4" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Thao tác tiếp?</text>
<rect x="352.5" y="874.7" width="175.0" height="101.4" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="440.0" y="896.0" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Hộp chọn nơi lưu; ghi</text>
<text x="440.0" y="913.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">CSV UTF-8 BOM (không</text>
<text x="440.0" y="930.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">có vi phạm → báo</text>
<text x="440.0" y="947.2" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">“Không có vi phạm nào</text>
<text x="440.0" y="964.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">để xuất”)</text>
<rect x="555.5" y="883.2" width="169.0" height="84.3" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="640.0" y="904.5" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Sau khi xác nhận: xóa vi</text>
<text x="640.0" y="921.6" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">phạm / phiên</text>
<text x="640.0" y="938.7" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">(CASCADE) và file ảnh;</text>
<text x="640.0" y="955.8" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">làm mới danh sách</text>
<rect x="753.5" y="874.7" width="173.0" height="101.4" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="840.0" y="896.0" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Tab “Lịch sử cấu hình”:</text>
<text x="840.0" y="913.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">xem bản chụp JSON;</text>
<text x="840.0" y="930.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">“Khôi phục cấu hình này”</text>
<text x="840.0" y="947.2" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">→ update_inplace(cfg),</text>
<text x="840.0" y="964.3" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">lưu</text>
<rect x="955.5" y="891.8" width="169.0" height="67.2" rx="12" fill="#f4f8fd" stroke="#1f1f1f" stroke-width="1.3"/>
<text x="1040.0" y="913.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">Tab “Ma trận camera”:</text>
<text x="1040.0" y="930.1" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">hiển thị K, H, R, f, chiều</text>
<text x="1040.0" y="947.2" font-family="Times New Roman" font-size="14" text-anchor="middle" fill="#000">cao, góc chúc, chân trời</text>
