name: adas_caotoc
description: "ADAS Cao tốc - cảnh báo khoảng cách an toàn (YOLOv11 TFLite + IPM) cho Android và iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  audioplayers: ^6.8.1
  camera: ^0.12.1
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  geolocator: ^14.0.1
  shared_preferences: ^2.5.6
  tflite_flutter: ^0.12.1
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/sounds/
    - assets/bench/
  # Be Vietnam Pro (OFL, assets/fonts/OFL.txt) - thiết kế cho tiếng Việt
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
